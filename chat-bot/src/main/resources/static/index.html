<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Assistant</title>
<style>
  :root {
    --bg: #f4f6f9; --surface: #ffffff; --text: #1b2430; --muted: #5a6677; --border: #d9dee6;
    --accent: #2b59c9; --accent-text: #ffffff; --user: #2b59c9; --user-text: #ffffff;
    --bot: #eef1f6; --warn-bg: #fff0d4; --warn: #8f5400; --ok: #17693f; --bad: #b0212b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --surface: #1a2029; --text: #e6ebf2; --muted: #9aa6b6; --border: #2d3644;
      --accent: #6d92f0; --accent-text: #0b1220; --user: #3a5fb8; --user-text: #ffffff;
      --bot: #232b37; --warn-bg: #3f2f0f; --warn: #f0b45a; --ok: #6fd6a0; --bad: #ff8b93;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1 1 auto; }
  .pill { font-size: .78rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
           color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.bot.refusal { border-left: 4px solid var(--warn); }
  .msg.bot.error { border-left: 4px solid var(--bad); }
  .thinking { color: var(--muted); font-style: italic; }
  .cite { font-size: .75em; vertical-align: super; color: var(--accent); font-weight: 700; }
  .note { font-size: .8rem; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 4px 8px; margin-top: 6px; white-space: normal; }
  details.sources { margin-top: 8px; font-size: .85rem; white-space: normal; }
  details.sources summary { cursor: pointer; color: var(--muted); }
  .src { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
  .src b { color: var(--accent); }
  .src small { color: var(--muted); display: block; }
  .meta { font-size: .72rem; color: var(--muted); margin-top: 6px; white-space: normal; }
  .welcome { text-align: center; color: var(--muted); padding: 24px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .chip { border-radius: 999px; font-size: .85rem; padding: 6px 12px; }
  footer { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); max-height: 140px; }
  .hint { max-width: 820px; margin: 6px auto 0; font-size: .75rem; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1 id="title">Company Assistant</h1>
  <span id="status" class="pill" role="status">checking…</span>
  <button id="reindex" type="button" title="Re-read the company documents and update the search index">Re-index documents</button>
  <button id="newchat" type="button">New chat</button>
</header>

<main id="main" aria-live="polite">
  <div class="wrap" id="chat">
    <div class="welcome" id="welcome">
      <div><strong id="welcome-title">Ask me about the company.</strong></div>
      <div>I answer only from the company's documents, and I show where each answer comes from.</div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <label class="sr-only" for="question">Your question</label>
    <textarea id="question" rows="1" maxlength="1000" placeholder="Type your question…" autofocus></textarea>
    <button id="send" class="primary" type="submit">Send</button>
  </form>
  <div class="hint">Answers are generated by a small local model from the indexed documents. Check the sources for anything important.</div>
</footer>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), main = $('main'), form = $('form'), input = $('question'), send = $('send');
  const SUGGESTIONS = [
    'What does the RouteWise Growth plan cost?',
    'How fast do you respond if our system is down?',
    'How many leave days do employees get?',
    'Where is customer data stored?'
  ];
  let sessionId = newId();
  let busy = false;
  let companyName = '';
  function welcomeText() { return companyName ? 'Ask me about ' + companyName + '.' : 'Ask me about the company.'; }

  function newId() {
    const a = new Uint8Array(12);
    (self.crypto || {getRandomValues: (x) => x.map(() => Math.random() * 256)}).getRandomValues(a);
    return 's' + Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;     // textContent only: model and document text is never treated as HTML
    return e;
  }

  function scrollDown() { main.scrollTop = main.scrollHeight; }

  /** Shows [1] markers as small superscripts, still using only text nodes and spans. */
  function renderText(target, text) {
    target.textContent = '';
    text.split(/(\[\d{1,2}\])/).forEach((part) => {
      if (/^\[\d{1,2}\]$/.test(part)) target.appendChild(el('span', 'cite', part));
      else if (part) target.appendChild(document.createTextNode(part));
    });
  }

  function addUser(text) {
    $('welcome')?.remove();
    chat.appendChild(el('div', 'msg user', text));
    scrollDown();
  }

  function addBot() {
    const box = el('div', 'msg bot');
    const body = el('div', 'thinking', 'Searching the documents…');
    box.appendChild(body);
    chat.appendChild(box);
    scrollDown();
    return {box, body};
  }

  function finish(bot, answer) {
    renderText(bot.body, answer.answer);
    bot.body.className = '';
    if (answer.mode === 'NO_ANSWER' || answer.mode === 'NO_DOCUMENTS') bot.box.classList.add('refusal');
    (answer.notes || []).forEach((n) => bot.box.appendChild(el('div', 'note', n)));
    if (answer.mode === 'ANSWER' && answer.sources && answer.sources.length) {
      const d = el('details', 'sources');
      d.appendChild(el('summary', null, 'Sources (' + answer.sources.length + ')'));
      answer.sources.forEach((s) => {
        const row = el('div', 'src');
        const head = el('div');
        head.appendChild(el('b', null, '[' + s.n + '] '));
        head.appendChild(document.createTextNode(s.source));
        row.appendChild(head);
        row.appendChild(el('small', null, s.title));
        row.appendChild(el('div', null, s.excerpt));
        d.appendChild(row);
      });
      bot.box.appendChild(d);
    }
    const secs = ((answer.retrieveMillis + answer.generateMillis) / 1000).toFixed(1);
    bot.box.appendChild(el('div', 'meta', answer.mode.replace('_', ' ').toLowerCase() + ' · ' + secs + ' s'));
    scrollDown();
  }

  function fail(bot, message) {
    bot.body.className = '';
    bot.body.textContent = message;
    bot.box.classList.add('error');
    scrollDown();
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; send.disabled = true;
    addUser(question.trim());
    const bot = addBot();
    let started = false, streamed = '';
    try {
      const response = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({sessionId, question: question.trim()})
      });
      if (!response.ok || !response.body) {
        let msg = 'The assistant could not answer (HTTP ' + response.status + ').';
        try { const p = await response.json(); if (p.detail) msg = p.detail; } catch (_) { /* keep default */ }
        fail(bot, msg);
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        let cut;
        while ((cut = buffer.indexOf('\n\n')) >= 0) {
          const raw = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
          let event = 'message', data = '';
          raw.split('\n').forEach((line) => {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            else if (line.startsWith('data:')) data += line.slice(5).trim();
          });
          if (!data) continue;
          const payload = JSON.parse(data);
          if (event === 'token') {
            if (!started) { started = true; bot.body.className = ''; bot.body.textContent = ''; }
            streamed += payload.t;
            renderText(bot.body, streamed);
            scrollDown();
          } else if (event === 'done') {
            finish(bot, payload);
          } else if (event === 'error') {
            fail(bot, payload.message);
          }
        }
      }
    } catch (e) {
      fail(bot, 'Cannot reach the assistant. Is the application running?');
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  async function refreshStatus() {
    const pill = $('status');
    try {
      const s = await (await fetch('/api/status')).json();
      companyName = s.company;
      $('title').textContent = s.company + ' Assistant';
      document.title = s.company + ' Assistant';
      const welcome = $('welcome-title');   // gone after the first question: must not break the status check
      if (welcome) welcome.textContent = welcomeText();
      if (!s.ollamaUp) { pill.textContent = 'Model server offline'; pill.className = 'pill bad'; pill.title = s.ollamaMessage || ''; return s; }
      if (s.ollamaMessage) { pill.textContent = 'Model missing'; pill.className = 'pill bad'; pill.title = s.ollamaMessage; return s; }
      pill.textContent = s.documents + ' documents · ' + s.passages + ' passages' + (s.vectorsComplete ? '' : ' · keyword search only');
      pill.className = 'pill ' + (s.passages > 0 ? 'ok' : 'bad');
      pill.title = s.chatModel + ' + ' + s.embedModel;
      return s;
    } catch (e) {
      pill.textContent = 'Backend offline'; pill.className = 'pill bad';
    }
  }

  function resetChat() {
    sessionId = newId();
    chat.textContent = '';
    const w = el('div', 'welcome');
    w.id = 'welcome';
    const heading = w.appendChild(el('div', null)).appendChild(el('strong', null, welcomeText()));
    heading.id = 'welcome-title';
    w.appendChild(el('div', null, "I answer only from the company's documents, and I show where each answer comes from."));
    chat.appendChild(w);
    addChips();
  }

  function addChips() {
    let w = $('welcome');
    if (!w) return;
    const wrap = el('div', 'chips'); wrap.id = 'chips';
    SUGGESTIONS.forEach((q) => {
      const b = el('button', 'chip', q); b.type = 'button';
      b.addEventListener('click', () => ask(q));
      wrap.appendChild(b);
    });
    w.appendChild(wrap);
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); const q = input.value; input.value = ''; autosize(); ask(q); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
  input.addEventListener('input', autosize);
  $('newchat').addEventListener('click', () => { if (!busy) resetChat(); });
  $('reindex').addEventListener('click', async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Indexing…';
    try {
      const r = await (await fetch('/api/ingest', {method: 'POST'})).json();
      const msg = 'Index updated: ' + r.files + ' files (' + r.added + ' new, ' + r.updated + ' changed, ' + r.unchanged + ' unchanged, ' + r.removed + ' removed), '
        + r.chunks + ' passages.' + (r.warnings.length ? '\n' + r.warnings.join('\n') : '');
      const box = el('div', 'msg bot', msg); chat.appendChild(box); scrollDown();
    } catch (err) {
      chat.appendChild(el('div', 'msg bot error', 'Re-indexing failed.'));
    } finally { b.disabled = false; b.textContent = 'Re-index documents'; refreshStatus(); }
  });

  addChips();
  refreshStatus();
  setInterval(refreshStatus, 30000);
})();
</script>
</body>
</html>
